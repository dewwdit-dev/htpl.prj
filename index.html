<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doğum Günün Kutlu Olsun 🎂</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        font-family: Arial, sans-serif;
    }

    .sahne {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    #buton {
        padding: 20px 35px;
        border: none;
        border-radius: 50px;
        background: white;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 0 8px 30px #0003;
    }

    #baslik {
        position: absolute;
        text-align: center;
        color: white;
        font-size: clamp(40px, 12vw, 100px);
        opacity: 0;
        transform: scale(0.3);
        transition: 1.5s;
        text-shadow: 0 5px 20px #0005;
    }

    #baslik.goster {
        opacity: 1;
        transform: scale(1);
    }

    .kalp {
        position: absolute;
        font-size: 30px;
        animation: uc 4s linear forwards;
    }

    @keyframes uc {
        0% {
            transform: translateY(100vh) rotate(0deg);
            opacity: 1;
        }

        100% {
            transform: translateY(-120vh) rotate(360deg);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="sahne">

    <button id="buton">
        Tıkla 🎁
    </button>

    <h1 id="baslik">
        İYİ Kİ DOĞDUN! 🎂
    </h1>

</div>

<script>

const buton = document.getElementById("buton");
const baslik = document.getElementById("baslik");

buton.addEventListener("click", function() {

    buton.style.display = "none";

    baslik.classList.add("goster");

    for (let i = 0; i < 25; i++) {

        const kalp = document.createElement("div");

        kalp.className = "kalp";
        kalp.innerHTML = "❤️";

        kalp.style.left = Math.random() * 100 + "vw";
        kalp.style.animationDelay = Math.random() * 2 + "s";

        document.body.appendChild(kalp);

    }

});

</script>

</body>
</html>
